[package]
name = "uniid-mp-access"
version = "0.1.0"
authors = ["Gerstein Lab"]
edition = "2021"
description = "TEE-backed access control for the most-private (MP) layer of a partitioned genomic file"

exclude = ["contract.wasm", "hash.txt"]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[features]
default = []
backtraces = ["cosmwasm-std/backtraces"]

[dependencies]
cosmwasm-std = { package = "secret-cosmwasm-std", version = "1.1.11" }
cosmwasm-storage = { package = "secret-cosmwasm-storage", version = "1.1.11" }
secret-toolkit = { version = "0.10.0", default-features = false, features = [
    "storage",
    "serialization",
    "permit",
    "utils",
] }
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"

# Pinned only to keep the build on the older Rust toolchain used for this
# check. Remove when building with a current toolchain.
base64ct = "=1.6.0"
zeroize = "=1.7.0"
